# --------------------------------------------------------------------------------
# Textos que ocupan la celda del codigo pero no son codigos: marcadores de "esto
# esta sin definir" y alguna fuga de la columna Obs. Se descartan con motivo.
# --------------------------------------------------------------------------------
code_rejections:
  - NON DEFINED
  - N.D.
  - UNIQUE SOLUTION
  - U.S.
  - U.S. N.D.
  - EJECUTADO
  - MANUAL
  - CHECK
  - PENDIENTE
  - TIRANTE DE ANCLAJE      # descripcion escrita en la celda del codigo

# --------------------------------------------------------------------------------
# Reenrutado por codigo. Algunas categorias del BOQ son cajones de sastre y meten
# codigos que pertenecen a otra entidad:
#   - ANCLAJES (EP6/EP9A) mezcla anclajes reales con material C-5xx y algun poste.
#   - HEADSPAN LOD STATION AND DEPOT (EP9B) mezcla portico con cimentaciones.
#   - Las categorias de FOUNDATIONS incluyen a veces el anclaje asociado (AnM/PL).
# Se evalua en orden; "to: null" descarta la fila.
# --------------------------------------------------------------------------------
code_reassignment:
  - {from: Foundation, regex: "^ANMC?/", to: AnchorageFoundation}
  - {from: AnchorageFoundation, regex: "^C-\\d", to: null}          # material
  - {from: AnchorageFoundation, regex: "^HEB-", to: PoleType}
  - {from: AnchorageFoundation, regex: "^(SF_|SSF_|SS2F_|FW-D)", to: null}
  - {from: Portal, regex: "^2?C\\d*[A-Z]*R?T?$", to: Foundation}    # 2C4FR, C12FRT
  - {from: Portal, regex: "^T-SIGN", to: Foundation}

# --------------------------------------------------------------------------------
# Derivacion de las relaciones @ManyToOne obligatorias hacia los catalogos *Type.
# El BOQ no trae el tipo, asi que se deduce del prefijo del codigo. Las reglas se
# evaluan EN ORDEN y gana la primera que casa.
# --------------------------------------------------------------------------------
type_rules:
  Foundation:
    - {suffix: "_L", type: CXR_L}
    - {prefix: ["WT", "2WT"], type: WTX}
    - {prefix: ["WD", "2WD"], type: WDX}
    - {prefix: ["W", "2W"], type: WX}
    - {prefix: ["PL"], type: PLX}
    - {regex: "^2?C", type: CX}
  Portal:
    - {regex: "^2?PR1", type: PR1X}
    - {regex: "^2?PR[A-F]?-", type: PR1X}
    - {prefix: ["SP"], type: SP1R}
    - {equals: ["B7"], type: B7}
    - {equals: ["HEADSPAN"], type: HEADSPAN}
    - {regex: "^F-?120", type: HEADSPAN}    # vanos de headspan de EP9B
    - {prefix: ["C-"], type: GANTRY}
  AnchorageFoundation:
    - {prefix: ["ANMC"], type: AnMC}
    - {prefix: ["ANM", "ANRW", "ANFW", "ANMP"], type: AnM}

# Casos que las reglas por prefijo no resuelven bien (filas cruzadas de categoria y
# sueltos). Clave = codigo en MAYUSCULAS.
type_overrides:
  Foundation:
    T-SIGN FOUND.: CX
    T-SIGN FOUND: CX
    P8R: CX
    P8RT: CX
    P9R: CX
    P9RT: CX
  AnchorageFoundation:
    PL*: AnM
    WT3: AnM

# Catalogo de tipos que se siembra ANTES que las LOVs que lo referencian.
# Las descripciones salen de la hoja Legend (secciones POLE FOUNDATION y PORTALS).
type_catalog:
  FoundationType:
    CX: Pole foundation Type CX
    CXR_L: Pole foundation Type CX in L
    PLX: Base for pole in viaduct
    WX: Base for pole in Lateral wall
    WDX: Base for pole with drainage
    WTX: Base for pole in Top wall
  PortalType:
    PR1X: Portal type X
    SP1R: Semi Portal
    B7: Semi Portal type B7
    HEADSPAN: Headspan
    GANTRY: Gantry
  AnchorageFoundationType:
    AnMC: Messenger and contact wire anchorage foundation
    AnM: Return, Feeder and Midpoint anchorage foundation

# Entidades que llevan columna drawing_number en la entidad JPA.
entities_with_drawing_number:
  - Anchorage
  - AnchorageFoundation
  - CantileverType
  - Foundation
  - PoleType
  - Portal
  - ReturnSupport
  - SupportType

# Entidades LOV en el alcance de este catalogo, en orden de carga.
entities:
  - Sectioning
  - Anchorage
  - AnchorageFoundation
  - Foundation
  - PoleType
  - Portal
  - SupportType
  - CantileverType
  - SteadyArmType
  - ReturnSupport
  - DisconnectorFunction
