# ================================================================================
# FORMATO SINOPTICO (RUBI, Linha Rubi de Metro do Porto).
#
# Una sola hoja con las dos vias en ESPEJO: la via 2 a la izquierda, leyendo hacia
# fuera, y la via 1 a la derecha, separadas por una banda central sin cabecera. Lo lee
# data/tools/synoptic.py para LOS DOS generadores, y se activa con 'format: synoptic'
# en topology.yml. Todo lo que hay aqui es especifico de ese formato: las tablas
# globales de arriba no se tocan por el.
#
# El origen escribe en portugues y en espanol; a la base de datos llega INGLES. Esta
# seccion es el unico sitio que conoce las grafias del origen: 'translations' las
# convierte en codigos del catalogo y 'descriptions' explica los codigos nuevos, que
# aqui no vienen de ninguna leyenda.
# ================================================================================
synoptic:
  # La fila de cabecera es la que trae esta celda; los dos marcadores, en esa misma
  # fila, parten la hoja en los dos bloques de via.
  header_marker: SUPORTE
  block_markers: ['VIA 2', 'VIA 1']

  # Cabecera del origen (minusculas, espacios colapsados) -> campo. La cabecera se
  # escribe IGUAL en los dos bloques, asi que la tabla es una. 'Tipologia' y 'Tipología'
  # solo se distinguen por la tilde y son dos cosas: el sistema de catenaria del apoyo
  # (rigida, flexible, mensula) y la funcion del apoyo en el seccionamiento.
  columns:
    suporte: PROFILE_ID
    p.k. (vía 1): KP
    p.k. (vía 2): KP
    vão (m): SPAN
    implantação (m): RAIL_POLE_DISTANCE     # metros en el origen; el campo va en mm
    tipologia: SUPPORT_TYPE                 # sin tilde: sistema de catenaria
    tipología: SECTIONING                   # con tilde: funcion del apoyo
    seccionamento: SECTIONING
    equipamentos associados: EQUIPMENT      # anclajes y aparatos mezclados: ver 'routing'
    tipo de suporte: POLE_TYPE
    maciços: FOUNDATION
    configuraciones: ASSEMBLY_CONFIGURATION
    consolas: CANTILEVER_TYPE
    desalinhamentos (cm): STAGGER
    alt. fc (m): CW_HEIGHT

  # Campos con columna GEMELA: la segunda mensula del apoyo va en columnas sin
  # cabecera pegadas por fuera a las de la primera, y 'Equipamentos associados' se
  # escribe dos veces. La gemela es la columna con la misma cabecera o, si no la hay,
  # la columna sin cabecera adyacente por el lado exterior.
  twins: [CANTILEVER_TYPE, STAGGER, CW_HEIGHT, EQUIPMENT]

  # Columnas reales sin campo en el dominio: se conservan en NO_MAPEADO.
  unmapped:
    - comentarios
    - subida feeder v1
    - subida feeder v2
    - l tubos consola (m)
    - l tubos consola
    - curve radius (m)
    - coord. x
    - coord. y
    - p.k. abs.vía 1                        # kilometracion absoluta de la red, solo via 1

  # Cabeceras que no son datos: la columna A lleva un 1 en cada fila.
  ignored: ['1']

  # Grafia del origen -> codigo INGLES del catalogo, por campo. Un valor vacio dice
  # que esa grafia NO es un codigo: 'S' es la suspension simple, sin seccionamiento.
  # Lo que no esta aqui se deja tal cual (los codigos de plano, los perfiles de acero).
  translations:
    SUPPORT_TYPE:
      Rígida: OCR SUPPORT                   # catenaria rigida: el codigo que ya usa EP6
      Funicular: FLEXIBLE
      Consola: SINGLE CANTILEVER
      Cons. Simp.: SINGLE CANTILEVER
      Cons. Dob.: DOUBLE CANTILEVER
    SECTIONING:
      # La funcion del apoyo con los codigos que ya tiene el catalogo: SE es el solape
      # (S/A), PF el punto fijo (MP), E el anclaje (A), Elev. la elevacion en el solape
      # (S/A) y PA<n> las agujas P<n>. Solo P80 es nuevo.
      S: ''
      SE: S/A
      S/E: S/A
      A/S: A/S
      PF: MP
      E: A
      Elev.: S/A
      Elev: S/A
      PA30: P30
      PA50: P50
      PA80: P80
      A/S-A/S: A/S                          # el mismo codigo dos veces en una celda
      Seccionamento: OVERLAP
      Transição Catenaria: TRANSITION
    CANTILEVER_TYPE:
      Delta: DELTA
      B. Fun.: FLEXIBLE ARM
      B.Fun.: FLEXIBLE ARM
      B. Fun: FLEXIBLE ARM
      C3- C.L.: C3-LONG                     # C3 long cantilever
      C3- C.C.: C3-SHORT                    # C3 short cantilever
    POLE_TYPE:
      Marquise: CANOPY                      # apoyo fijado a la marquesina del anden
      C860-B_: C860-B
    FOUNDATION:
      Anc. Corrente: STANDARD ANCHOR
      Anc. Ancoragem: ANCHORAGE ANCHOR
      Anc. Ancoragem.: ANCHORAGE ANCHOR
      Anc. Ponte: BRIDGE ANCHOR
      Anc. Sot.: UNDERGROUND ANCHOR
      Anc. Suelo: GROUND ANCHOR
      Anc. Pavi.: PAVEMENT ANCHOR
      Poste parede: WALL POLE
      Fixação Muro: WALL FIXING
    ASSEMBLY_CONFIGURATION:
      C.C,2: C.C.2                          # errata de tecleo
    EQUIPMENT:
      Ancoraem 1HC: An1CW
      Ancoraem 2HC: An2CW
      Ancoraem coneção Sto Ov.: AnCONN
      Caix. Secc. e Con.: SectConnBox
      Caix. Imped.: ImpBox
      Disp. Transic.: TransDev
      Aislador 1HC: SECT-I-1CW
      Aislador 2HC: SECT-I-2CW

  # 'Equipamentos associados' -> campo del perfil, segun el codigo ya traducido.
  routing:
    ANCHORAGE: [An1CW, An2CW, AnCONN]
    SECTIONING_FEEDING: [SectConnBox, ImpBox, TransDev, SECT-I-1CW, SECT-I-2CW]

  # Un valor escrito en la columna de otro catalogo: 'Aislad.' en la funcion del apoyo
  # es el aislador de seccion, que es un aparato de alimentacion (SECT-I).
  reassignment:
    SECTIONING:
      Aislad.: {to: SECTIONING_FEEDING, code: SECT-I}

  # Erratas del origen: salen vacias y anotadas en DESCARTADOS con su fila.
  rejections:
    SECTIONING: [Anc]

  # Anotaciones que no son codigo: se conservan en NO_MAPEADO. 'Cantón 396,4 m' es la
  # longitud del canton, que el dominio no guarda (como 'SEMI TENSION LENGTH' en los
  # workbooks ferroviarios).
  noise:
    SECTIONING:
      regex: '^Cant\w*\s*[\d.,]+\s*m$'

  # DESCRIPCION_EN de los codigos que solo existen en el sinoptico.
  descriptions:
    SupportType:
      FLEXIBLE: Flexible catenary (messenger and contact wire)
      SINGLE CANTILEVER: Tramway catenary on single cantilever
      DOUBLE CANTILEVER: Tramway catenary on double cantilever
    CantileverType:
      DELTA: Delta cantilever
      FLEXIBLE ARM: Flexible catenary arm
      C3-LONG: C3 long cantilever
      C3-SHORT: C3 short cantilever
    Sectioning:
      P80: Switch P80
      OVERLAP: Overlap section
      TRANSITION: Rigid/flexible catenary transition
    Anchorage:
      An1CW: Single contact wire anchorage
      An2CW: Double contact wire anchorage
      AnCONN: Connection anchorage (Santo Ovidio)
    DisconnectorFunction:
      SectConnBox: Sectioning and connection box
      ImpBox: Impedance bond box
      TransDev: Rigid/flexible transition device
      SECT-I-1CW: Section insulator on single contact wire
      SECT-I-2CW: Section insulator on double contact wire
    Foundation:
      M1: Foundation block M1
      M2: Foundation block M2
      M4: Foundation block M4
      M5: Foundation block M5
      M6: Foundation block M6
      M7: Foundation block M7
      STANDARD ANCHOR: Standard pole anchor
      ANCHORAGE ANCHOR: Anchorage pole anchor
      BRIDGE ANCHOR: Pole anchor on bridge
      UNDERGROUND ANCHOR: Pole anchor in underground section
      GROUND ANCHOR: Pole anchor on ground
      PAVEMENT ANCHOR: Pole anchor on pavement
      WALL POLE: Wall-mounted pole
      WALL FIXING: Wall fixing
    PoleType:
      C859-A: Pole as per drawing C859-A
      C859-B: Pole as per drawing C859-B
      C860-A: Pole as per drawing C860-A
      C860-B: Pole as per drawing C860-B
      C863-A: Pole as per drawing C863-A
      C863-B: Pole as per drawing C863-B
      Ø300/Ø180/e16: Tubular pole 300/180 mm, 16 mm wall
      HEA 220: Steel profile HEA 220
      HEA 240: Steel profile HEA 240
      HEA 280: Steel profile HEA 280
      HEA 280 G.: Steel profile HEA 280 G.
      HEA 300: Steel profile HEA 300
      HEM 320: Steel profile HEM 320
      IPE 120: Steel profile IPE 120
      Parafil: Parafil rope suspension
      CANOPY: Support fixed to platform canopy
      Pendulo 140: Pendulum support 140
    AssemblyConfiguration:
      # Generadas por patron: C.F.<n> son las configuraciones de montaje de la catenaria
      # flexible y C.C.<n> las de la catenaria de mensula.
      pattern:
        '^C\.F\.(.+)$': 'Flexible catenary assembly configuration \1'
        '^C\.C\.(.+)$': 'Cantilever assembly configuration \1'
