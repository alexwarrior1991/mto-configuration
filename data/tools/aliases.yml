# La clave se compara en MAYUSCULAS y con espacios colapsados.
# --------------------------------------------------------------------------------
boq_categories:
  # --- Foundation
  FOUNDATIONS: Foundation
  L FOUNDATIONS: Foundation
  FOUNDATION IN L: Foundation
  POLES SUPPORTS IN LATERAL WALL: Foundation
  SUPPORTS IN LATERAL WALLS: Foundation
  SUPPORTS IN WALLS: Foundation
  POLES SUPPORTS IN WALLS: Foundation          # EP15
  POLES SUPPORTS ON TOP WALL: Foundation
  SUPPORTS IN TOP WALLS: Foundation
  SUPPORTS ON TOP WALLS: Foundation            # EP14A, EP14B
  POLES SUPPORTS IN DRAINAGE: Foundation
  SUPPORTS IN DRENAIGE: Foundation             # sic, erratа en el origen
  BRIDGE SUPPORTS: Foundation
  VIADUCTO: Foundation
  VIADUCTO EXISTENTE: Foundation

  # --- AnchorageFoundation
  ANCHOR FOUND.: AnchorageFoundation
  L ANCHOR FOUND.: AnchorageFoundation
  ANC.SUP. L.WALL: AnchorageFoundation
  ANC.SUP. T.WALL: AnchorageFoundation
  TUNNEL ANCHOR: AnchorageFoundation
  ANCLAJES: AnchorageFoundation
  ANCLAJES EN TUNEL: AnchorageFoundation
  ANCLAJE TX TUNEL / MURO: AnchorageFoundation

  # --- PoleType
  POLES: PoleType
  POSTES: PoleType
  POSTES SIMPLES: PoleType                     # EP9B
  POSTES DOBLES: PoleType                      # EP9B
  POSTES ESPECIALES: PoleType                  # EP9B

  # --- Portal
  PORTALS: Portal
  PORTICOS: Portal
  "HEADSPAN\nSPRC": Portal
  HEADSPAN SPRC: Portal
  HEADSPAN LOD STATION AND DEPOT: Portal       # EP9B
  SEMIPÓRTICO: Portal                          # EP9B
  GANTRIES: Portal
  PÓRTICOS-F: Portal

  # --- SupportType
  CANTILEVER SUPPORTS: SupportType
  SILLETAS: SupportType

  # --- CantileverType
  CANTILEVERS: CantileverType

  # --- SteadyArmType
  STEADY ARMS: SteadyArmType
  BRAZOS MENS: SteadyArmType

  # --- ReturnSupport
