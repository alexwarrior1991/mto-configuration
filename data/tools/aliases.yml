# --------------------------------------------------------------------------------
# Tipos de brazo, para poder partir la columna 'Arm Type'.
#
# El origen escribe el tipo y la longitud juntos ('PH-1150', 'BTC-1651') pero el
# catalogo SteadyArmType solo tiene el tipo base. La regla para separarlos es
# "sufijo numerico = longitud", y hace falta esta lista porque 'PH-C' y 'PH-Q' son
# tipos que TAMBIEN llevan guion: sin saber cuales existen, 'PH-C' se partiria mal.
#
# Tiene que coincidir con los codigos habilitados de SteadyArmType en
# lov-master.xlsx. Hay un test que lo comprueba.
# --------------------------------------------------------------------------------
steady_arm_types:
  - BC
  - BCE
  - BS
  - BTC
  - PH
  - PH-C
  - PH-Q
  - PHC
  - PHQ

# Erratas del TIPO de brazo. Van aparte de code_canonical porque hay que aplicarlas
# ANTES de separar el tipo de la longitud: 'BHC-1150' no llega entero a ningun sitio
# donde una tabla de grafias pudiera verlo, y sin esto el brazo se perdia con un
# "tipo de brazo desconocido".
steady_arm_type_aliases:
  BHC: PHC

# --------------------------------------------------------------------------------
# Cabeceras de las hojas HR Track -> campo del maestro de perfiles.
#
# Las 177 hojas escriben las mismas ~36 columnas logicas de 66 formas distintas, y
# hay una hoja (EP6 / HR Track 1 HER) sin columna 'Sectionning' que desplaza todo lo
# posterior una posicion. Por eso el generador resuelve POR NOMBRE y nunca por
# indice: leer por posicion corromperia esa hoja en silencio.
#
# La clave se compara en minusculas y con espacios colapsados. Una cabecera que no
# este en ninguna de las tres listas va a NO_RECONOCIDO y el generador termina con
# codigo != 0.
# --------------------------------------------------------------------------------
profile_columns:

  # Una columna por perfil.
  profile:
    profile: PROFILE_ID

    kp: KP
    k.p. (m): KP
    theorical k.p. (m): KP

    # El vano vive en la fila INTERMEDIA, entre este perfil y el siguiente: 11.475
    # de los 11.490 valores medidos estan ahi. Es el vano hasta el perfil siguiente.
    span: SPAN
    span (m): SPAN
    th. span: SPAN
    th span: SPAN

    height cantilever support: HEIGHT_CANTILEVER_SUPPORT
    height cant. support (mm): HEIGHT_CANTILEVER_SUPPORT

    gauge pole location: POLE_GAUGE_LOCATION
    pole gauge location (mm): POLE_GAUGE_LOCATION

    distance rail-pole: RAIL_POLE_DISTANCE
    rail-pole distance (mm): RAIL_POLE_DISTANCE

    # Listas de valores: se resuelven por codigo contra el catalogo.
    sectionning: SECTIONING
    anchorage: ANCHORAGE
    anchorage foundation: ANCHORAGE_FOUNDATION
    pole type: POLE_TYPE
    foundation: FOUNDATION
    portals: PORTAL
    return support: RETURN_SUPPORT
    sectioning feeding: SECTIONING_FEEDING

  # Grupos de TRES columnas (subcabecera M1/M2/M3, D1/D2/D3, ...): una mensula por
  # slot ocupado. Un perfil admite tres como maximo, que es justo lo que da el
  # origen y lo que impone la entidad.
  cantilever:
    cantilevers: CANTILEVER_TYPE
    arm type: STEADY_ARM          # lleva tipo y longitud juntos: 'PH-1150'

    stagger: STAGGER
    stagger (cm): STAGGER

    catenary height: CATENARY_HEIGHT
    catenary height (m): CATENARY_HEIGHT
    catenary heigh: CATENARY_HEIGHT

    elevation cw: CW_ELEVATION
    elevation cw (m): CW_ELEVATION

    cw height: CW_HEIGHT
    cw height (m): CW_HEIGHT
    cw heigh: CW_HEIGHT
    contact wire height: CW_HEIGHT

    wind deflection: WIND_DEFLECTION
    arm angle: ARM_ANGLE

  # Columnas reales del origen que HOY no tienen campo en el dominio. No se
  # descartan: van a la hoja NO_MAPEADO con su EP, via, perfil y fila de origen, de
  # modo que ampliar el modelo mas adelante sea un cambio de esquema y no volver a
  # analizar 60 MB de Excel.
  unmapped:
    - survey
    - other pk
    - other kp
    - theorical cant
    - theorical cant (mm)
    - track layout
    - track layout (m)
    - anchorage kp
    - anchorage pk
    - anchorages pk
    - current cant
    - current cant (mm)
    - current track layout
    - current track layout (m)
    - current span
    - current span (m)
    - track kp
    - track pk
    - current track pk
    - supports
    - soil found
    - embankment
    - embank.
    - terrain geometry
    - depth found
    - depth pole f. (m)
    - depth anchor
    - depth anchor f. (m)
    - approved by kedmor
    - pole calculation reference

# --------------------------------------------------------------------------------
# Grafias distintas del MISMO codigo. La clave es como aparece en el origen; el
# valor, la forma canonica. Se aplica antes de agrupar, asi que los usos se suman
# en una unica fila en lugar de repartirse entre variantes.
#
# Las diferencias de solo mayusculas NO hacen falta aqui: la clave del catalogo ya
# es (entidad, CODIGO en mayusculas), asi que 'DISC/IO' y 'Disc/IO' colapsan solos.
# Esto es para lo que ademas cambia de caracteres.
# --------------------------------------------------------------------------------
# Codigos ATOMICOS de las columnas que admiten varios valores.
#
# Son los que declara la hoja Legend de los workbooks, mas la familia de agujas, que la
# leyenda no enumera una a una porque cada valor es una aguja distinta ('Switch Point 50'
# es P50, 'Switch Point 90' es P90, y en casos puntuales hay otras).
#
# Lo que esta aqui SE PARTE al cosechar: una celda cuyos trozos sean TODOS atomos se
# registra como varios codigos y no como uno. Lo que no esta, se queda entero, y eso es
# lo que salva a los codigos legitimos con espacio ('T-SIGN FOUND.', 'UNIQUE SOLUTION').
#
# Sin esto, un atomo que el origen solo escribe DENTRO de una celda compuesta —P59(CS)
# solo aparece en 'A/S P59(CS)'— no llegaba a existir como fila del catalogo, y no habia
# nada que habilitar.
# --------------------------------------------------------------------------------
# Codigos que NO estan en ningun workbook y pone este proyecto.
#
# Solo para lo que el origen deja sin nombrar y el dominio EXIGE. Hoy es uno.
#
# El tipo de mensula es obligatorio (@ManyToOne no anulable, y CantileverValidator lo
# sigue pidiendo despues de relajar los seis numericos). Hay 217 huecos M1/M2/M3 que
# traen medidas propias —desviacion, altura de catenaria, brazo— y la celda del tipo
# vacia. Sin un codigo al que colgarlos, esas 217 mensulas se pierden ENTERAS: no es
# que les falte un dato, es que no hay fila.
#
# Un codigo puesto aqui sale del generador con ORIGEN=MTO, que lo distingue a simple
# vista de los que vienen del BOQ, del Legend o de las hojas Track.
# --------------------------------------------------------------------------------
synthetic_codes:
  CantileverType:
    - code: UNKNOWN
      desc_en: Cantilever type not stated in the source workbook
      desc_es: Tipo de mensula sin declarar en el workbook de origen

# --------------------------------------------------------------------------------
# Tipo de mensula cuando el hueco trae medidas propias y no trae tipo.
#
# 'default' es el ultimo recurso. Antes se mira la columna 'Supports' de esa misma
# fila: en los postes de catenaria RIGIDA dice 'OCR SUPPORT' (Overhead Conductor
# Rail), y ahi la mensula no es que falte, es que es la de OCR —un codigo que ya
# existe en el catalogo, con 23 usos en EP9B, donde SI lo escriben en la columna del
# tipo—. Son 61 huecos de EP6 'HR Track 1 TSA-THA' y 'HR Track 2 TSA-THA'.
#
# Lo que NO recibe tipo es el hueco que solo trae cwHeight y/o armAngle: el primero
# es un valor de proyecto repetido a lo largo del tramo y el segundo es calculado,
# asi que aparecen igual donde no hay ninguna mensula. Esos se siguen tirando.
# --------------------------------------------------------------------------------
cantilever_type_fallback:
  default: UNKNOWN
  by_support:
    OCR SUPPORT: OCR
  # Campos cuya presencia prueba que ahi SI hay una mensula. cwHeight y armAngle no
  # estan, y no es un olvido: son justamente los dos que aparecen sin mensula.
  evidence: [STAGGER, CATENARY_HEIGHT, CW_ELEVATION, WIND_DEFLECTION, STEADY_ARM]

# --------------------------------------------------------------------------------
code_atoms:
  Sectioning:
    exact: ['A/S', 'A/S-Diag', 'S/A', 'A', 'MP', 'MP/Tunnel', 'AnMP', 'AnMP/Tunnel', 'P50', 'P90']
    regex: '^P\d+(\([A-Za-z]+\))?$'          # agujas: P50, P90, P30(CS), P120(Tg)...
  Anchorage:
    # Los doce de la leyenda ANCHORAGE, mas AnRW1 / AnRW2 / AnRW2/Tunnel, que son
    # anclajes DISTINTOS de AnRW y no "dos AnRW": el numero forma parte del codigo.
    exact: ['CP+AnMC', 'FP+AnMC', 'CP/Tunnel', 'FP/Tunnel', 'AnFW', 'AnRW',
            'AnFW/Tunnel', 'AnRW/Tunnel', 'AnRW1', 'AnRW2', 'AnRW2/Tunnel', 'IO']
    # CP/TX-P, CP/TX-T y CP/TX-W, cada uno con o sin longitud: nueve anclajes distintos.
    # La leyenda solo dibuja tres (CP/TX-P/1100, CP/TX-T, CP/TX-W/1100) pero los datos
    # traen las nueve combinaciones.
    regex: '^CP/TX(-[PTW](/\d+)?)?$'

# --------------------------------------------------------------------------------
# Trozos que una columna escribe AL LADO del codigo sin que formen parte de el.
# Se tiran al partir la celda; el codigo que queda es el que vale.
#
# Solo se declara lo que en ESA columna no puede ser un codigo. Un numero suelto sobra
# en ANCHORAGE —es la longitud de semitension, el 'xxx m.' de la leyenda, y el dominio
# no tiene donde guardarla— pero no es una regla general.
# --------------------------------------------------------------------------------
code_noise_tokens:
  Anchorage:
    # 'Portal' tiene su propia columna y su propio catalogo: aqui es una fuga.
    # 'T1' y 'track 1' son anotaciones de via, que ya la sabe la via.
    exact: ['Portal', 'Track', 'T1', 'T2', 'T3']
    regex: '^\d+([.,]\d+)?$'        # 265,00 / 527,00 / 287: longitud, no codigo

# --------------------------------------------------------------------------------
code_canonical:
  Anchorage:
    # Erratas de tecleo sobre codigos de la leyenda. Solo las que cambian de CARACTERES:
    # las que solo cambian de mayusculas ('FP+ANMC', 'CP+AnmC') colapsan solas, porque la
    # clave del catalogo ya es el codigo en mayusculas.
    # 'AnRW1' es 'AnRW': el 1 es la cuenta, y uno es el codigo a secas. El 2 de 'AnRW2'
    # SI es parte del codigo —es otro anclaje— y por eso ese no se toca. Lo mismo con el
    # 2 delante: cuenta anclajes, y el modelo es un conjunto, asi que colapsa a uno.
    'AnRW1': AnRW
    '2AnRW': AnRW
    'PF+AnMC': FP+AnMC          # PF por FP
    'CP+AnCM': CP+AnMC          # CM por MC
    'FP+AnCM': FP+AnMC
    'CP+AMC': CP+AnMC           # se comio la n
    'CP+TX-P/1100': CP/TX-P/1100   # '+' por '/'
    # Dos codigos escritos sin el espacio que los separa. Ponerlo aqui es lo que deja
    # que el troceo los vea como dos: solo, no hay forma de saber donde parte 'FP+AnMCAnRW'.
    'FP+AnMCAnRW': FP+AnMC AnRW
    'AnRWAnRW': AnRW AnRW
  Sectioning:
    # 'A/S-Diag' escrito con espacio en vez de guion. Sin esto se lee como dos valores
    # ('A/S' y un 'Diag' que no existe) justo ahora que el seccionamiento admite varios.
    'A/S Diag': A/S-Diag
    'A/S  Diag': A/S-Diag
    # Erratas de la misma grafia, vistas en el origen.
    'A/S-Diang': A/S-Diag
    'A/S-Diag1': A/S-Diag
    'SA': S/A
  AnchorageFoundation:
    'U.S.': UNIQUE SOLUTION
    'Unique Solution': UNIQUE SOLUTION
    'U.SOLUTION': UNIQUE SOLUTION
  Foundation:
    'Unique Solution': UNIQUE SOLUTION
    'Unique solution': UNIQUE SOLUTION
    'UnIque Solution': UNIQUE SOLUTION
    'U.S.': UNIQUE SOLUTION
    'U.SOLUTION': UNIQUE SOLUTION
    'U. SOLUTION': UNIQUE SOLUTION
    'T-SING FOUND.': T-SIGN FOUND.
    'T-SIGN FOUND,': T-SIGN FOUND.
  DisconnectorFunction:
    # '-pp' es una errata de '-pr'. Solo 4 filas, las cuatro en EP9A.
    'Disc-pp': Disc-pr
    'LoadB-pp': LoadB-pr
    # Familia FW (feeder wire): cuatro formas de escribir dos codigos.
    FW25: FW-25
    FW+25: FW-25
    F-25: FW-25
    2-25FW: 2xFW-25

    # NZ (neutral zone) y NS (neutral section) son lo mismo. Lo confirma la leyenda
    # de EP9B, que llama "N.Z. Disconnector" justo al codigo Disc/NS.
    LoadB/NZ: LoadB/NS
    DISC/NZ: Disc/NS

    # Erratas de tecleo sobre codigos que ya estan en el catalogo.
    SECT-1: SECT-I          # I mayuscula de "Insulator", no un uno
    PP/2: PP-2
    FS/PP2: FS/PP-2
    Load/IO: LoadB/IO
    Voltage: VoltageD
    Voltage D: VoltageD
    Current: CurrentT
    Surge A: SurgeA
    LoadB/IO_pr: LoadB/IO-pr   # guion bajo por guion; el destino ya existe

    # Grafia preferida cuando el catalogo curado no la fija.
    DISC/PP: Disc/PP

# --------------------------------------------------------------------------------
# Codigos que SOLO aparecen en las hojas Track y que una persona ha revisado y
# aceptado. Sin estar aqui saldrian con ENABLED=NO, que es el valor por defecto de
# ORIGEN=TRACK: son codigos en uso real que ningun catalogo curado recoge.
#
# La decision vive aqui y no en el Excel generado a proposito: el maestro se
# regenera y se llevaria por delante cualquier ENABLED=SI puesto a mano.
#
# Lo que NO esta aceptado se queda con ENABLED=NO y REVISAR=SI, que es justo el
# estado "pendiente de decidir" y lo deja a la vista sin romper la generacion.
# --------------------------------------------------------------------------------
track_accepted:
  SteadyArmType:
    # Solo aparece en una hoja de trazado y en ningun BOQ, pero es un tipo de brazo
    # real, no una errata: 'BS-1400' de EP9B / HR Track 2 LOD_S.
    - BS
  Anchorage:
    # Solo codigos ATOMICOS: las 28 entradas que habia antes eran, en su mayoria, celdas
    # con dos anclajes ('CP+AnMC IO'), erratas ('PF+AnMC') o anotaciones ('TRACK 5') que
    # entraron al catalogo porque se cosecha leyendo cada celda como si fuera un codigo.
    - AnMC
    - AnMP
    - AnRW2
    - AnRW2/Tunnel
    - CP
  AnchorageFoundation:
    - AnFW-RT
    - AnFW-RTL
    - AnMC-W
    - AnMP-R
    - AnMP-RT
    - AnRW-R
    - AnRW-RT
    - 'UNIQUE SOLUTION'
  CantileverType:
    - 48-1-
    - EMT-1-RH
    - EMT-1P(Diag)
    - EMT-2-RH
    - EMT-2HR
    - EMT-P
    - EMT-R
    - EMT-TRH
    - EMT1
    - EMT1P
    - EMT2
    - EMT21P
    - EMT2P
    - ENT-1
    - ENT-2
    - ETM-2
    - H-ARM
    - ISOL.SUSP.
    - OCR
  DisconnectorFunction:
    - 2xFW-25
    - Disc/PP
    - FW
    - FW-25
    - FW-D
    - FW-DV
    - LoadB/ED
    - LoadB/t
