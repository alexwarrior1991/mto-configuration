# Tablas de alias de los generadores de data/tools.
#
# Las usan los dos: build_lov_master.py (catalogo de LOVs) y build_profile_master.py
# (perfiles, vias, estaciones y EPs). Comparten fichero a proposito, porque leen LAS
# MISMAS hojas: si una grafia de cabecera nueva aparece, los dos tienen que conocerla
# y en dos ficheros acabarian discrepando.
#
# Este fichero existe para que ampliar el mapeo NO sea tocar el script. Cuando el
# generador encuentra algo que no esta aqui NO lo descarta en silencio: lo vuelca en
# la hoja NO_RECONOCIDO del maestro y termina con codigo de salida != 0.
#
# Asi se detectaron 13 categorias (~107 filas) que aparecian solo en los workbooks
# EP9B / EP14A / EP14B / EP15 y que se habrian perdido sin avisar.

# --------------------------------------------------------------------------------
