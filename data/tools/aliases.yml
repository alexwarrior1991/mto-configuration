# --------------------------------------------------------------------------------
# Textos que ocupan la celda del codigo pero no son codigos: marcadores de "esto
# esta sin definir" y alguna fuga de la columna Obs. Se descartan con motivo.
# --------------------------------------------------------------------------------
code_rejections:
  - NON DEFINED
  - N.D.
  - U.S. N.D.
  - EJECUTADO
  - MANUAL
  - CHECK
  - PENDIENTE
  - TIRANTE DE ANCLAJE      # descripcion escrita en la celda del codigo
  # No es un marcador de "aqui no hay dato" como los de arriba, sino una MEDIDA escrita
  # donde va el codigo: el diametro y la profundidad de la zapata. No se da de alta —una
  # medida no es un tipo de cimentacion— y se trata como hueco para que deje de salir
  # como codigo pendiente. 4 celdas, EP11B.
  - Ø500*1700

# --------------------------------------------------------------------------------
# Reenrutado por codigo. Algunas categorias del BOQ son cajones de sastre y meten
# codigos que pertenecen a otra entidad:
#   - ANCLAJES (EP6/EP9A) mezcla anclajes reales con material C-5xx y algun poste.
#   - HEADSPAN LOD STATION AND DEPOT (EP9B) mezcla portico con cimentaciones.
#   - Las categorias de FOUNDATIONS incluyen a veces el anclaje asociado (AnM/PL).
# Se evalua en orden; "to: null" descarta la fila.
# --------------------------------------------------------------------------------
code_reassignment:
  - {from: Foundation, regex: "^ANMC?/", to: AnchorageFoundation}
  - {from: AnchorageFoundation, regex: "^C-\\d", to: null}          # material
  - {from: AnchorageFoundation, regex: "^HEB-", to: PoleType}
  - {from: AnchorageFoundation, regex: "^(SF_|SSF_|SS2F_|FW-D)", to: null}
  - {from: Portal, regex: "^2?C\\d*[A-Z]*R?T?$", to: Foundation}    # 2C4FR, C12FRT
  - {from: Portal, regex: "^T-SIGN", to: Foundation}

  # 'Sectioning Feeding' es una FK y no puede con dos valores: la celda que lleva
  # dos equipos no se puede importar y hay que mirarla a mano.
  - {from: DisconnectorFunction, regex: "^(DISC SECT-I|FS-1 VOLTAGED|LOADB/NS FS-1|LOADB/PP FS-1)$", to: null}
  # Fugas de otras columnas: PHQ-1150 es un brazo y FP un anclaje (FP+AnMC).
  - {from: DisconnectorFunction, regex: "^(PHQ-\\d+|FP)$", to: null}

  # Fugas de la columna 'Sectioning Feeding' dentro de 'Supports'. SECT-I es un aislador
  # de seccion y FS-1 / FS/PP-2 son alimentaciones: los tres son aparatos, no soportes.
  # Fuera del catalogo de soportes para que la celda salga nombrada con su hoja y su
  # fila, que es lo que hay que corregir, en el workbook.
  - {from: SupportType, regex: "^(SECT-I|FS1|FS/PP2)$", to: null}

  # Fugas de la columna Anchorage dentro de SECTIONNING. La leyenda de los workbooks
  # declara AnRW (Return Anchor), AnFW (Feeder Anchor) e IO (Insulated Overlap) en
  # ANCHORAGE. Fuera del catalogo de seccionamiento: asi la celda que los trae sale en
  # NO_RECONOCIDO con su hoja y su fila —que es lo que hay que corregir, en el workbook—
  # en vez de cargarse como si fuera un seccionamiento.
  - {from: Sectioning, regex: "ANRW|ANFW|(^|\\s)IO($|\\s)", to: null}
  # 'POLE TRACK 14S' es una anotacion, no un codigo: hay que vaciar la celda. Y en
  # 'AnMP T A/S-Diag' la 'T' no es nada, pero 'AnMP' es un ANCLAJE: la celda no se puede
  # cargar hasta que se separe en el workbook, asi que sale nombrada con su hoja y su
  # fila en vez de cargarse a medias.
  #
  # '2MP S/A' y 'P50(CS) MPA' ya no estan aqui: sus erratas tienen alias en
  # code_canonical, asi que la celda se parte en codigos buenos y el perfil los recibe.
  - {from: Sectioning, regex: "^(POLE TRACK 14S|ANMP T A/S-DIAG)$", to: null}

  # Celdas de ANCHORAGE que no llevan ningun codigo: solo la via ('TRACK 5') o solo la
  # longitud de semitension ('278 287'). Sin esto se quedan en el catalogo como codigos,
  # porque al quitarles lo que sobra no queda nada que partir.
  - {from: Anchorage, regex: "^(TRACK \\d+|\\d+([.,]\\d+)?( \\d+([.,]\\d+)?)*)$", to: null}

# --------------------------------------------------------------------------------
# Derivacion de las relaciones @ManyToOne obligatorias hacia los catalogos *Type.
# El BOQ no trae el tipo, asi que se deduce del prefijo del codigo. Las reglas se
# evaluan EN ORDEN y gana la primera que casa.
# --------------------------------------------------------------------------------
type_rules:
  Foundation:
    # M3 Ø36, M5 Ø42... : cimentacion de poste con pernos metricos. Familia propia:
    # ninguna de las estructurales (CX, WX, WTX, WDX, PLX) describe un anclaje asi.
    - {regex: "^M[0-9]+ *\u00d8", type: MX}
    - {suffix: "_L", type: CXR_L}
    - {prefix: ["WT", "2WT"], type: WTX}
    - {prefix: ["WD", "2WD"], type: WDX}
    - {prefix: ["W", "2W"], type: WX}
    - {prefix: ["PL"], type: PLX}
    - {regex: "^2?C", type: CX}
  Portal:
    - {regex: "^2?PR1", type: PR1X}
    - {regex: "^2?PR[A-F]?-", type: PR1X}
    - {prefix: ["SP"], type: SP1R}
    - {equals: ["B7"], type: B7}
    - {equals: ["HEADSPAN"], type: HEADSPAN}
    - {regex: "^F-?120", type: HEADSPAN}    # vanos de headspan de EP9B
    - {prefix: ["C-"], type: GANTRY}
  AnchorageFoundation:
    - {prefix: ["ANMC"], type: AnMC}
    - {prefix: ["ANM", "ANRW", "ANFW", "ANMP"], type: AnM}

# Casos que las reglas por prefijo no resuelven bien (filas cruzadas de categoria y
# sueltos). Clave = codigo en MAYUSCULAS.
type_overrides:
  Foundation:
    UNIQUE SOLUTION: USX
    T-SIGN FOUND.: CX
    T-SIGN FOUND: CX
    P8R: CX
    P8RT: CX
    P9R: CX
    P9RT: CX
    # Sinoptico (RUBI): maciços y fijaciones de poste del metro, sin familia
    # estructural propia. Tipo MTX, ver type_catalog.
    M1: MTX
    M2: MTX
    M4: MTX
    M5: MTX
    M6: MTX
    M7: MTX
    STANDARD ANCHOR: MTX
    ANCHORAGE ANCHOR: MTX
    BRIDGE ANCHOR: MTX
    UNDERGROUND ANCHOR: MTX
    GROUND ANCHOR: MTX
    PAVEMENT ANCHOR: MTX
    WALL POLE: MTX
    WALL FIXING: MTX
  AnchorageFoundation:
    UNIQUE SOLUTION: AnUS
    PL*: AnM
    WT3: AnM

