  PortalType:
    PR1X: Portal type X
    SP1R: Semi Portal
    B7: Semi Portal type B7
    HEADSPAN: Headspan
    GANTRY: Gantry
  AnchorageFoundationType:
    AnMC: Messenger and contact wire anchorage foundation
    AnUS: Unique solution - bespoke anchorage foundation supplied separately
