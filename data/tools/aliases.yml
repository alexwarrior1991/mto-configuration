    CX: Pole foundation Type CX
    USX: Unique solution - bespoke foundation supplied separately
    MX: Pole foundation with metric anchor bolts
    CXR_L: Pole foundation Type CX in L
    PLX: Base for pole in viaduct
    WX: Base for pole in Lateral wall
    WDX: Base for pole with drainage
    WTX: Base for pole in Top wall
