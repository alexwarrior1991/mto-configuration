# Tablas de alias de los generadores de data/tools.
#
# Las usan los dos: build_lov_master.py (catalogo de LOVs) y build_profile_master.py
# (perfiles, vias, estaciones y EPs). Comparten fichero a proposito, porque leen LAS
# MISMAS hojas: si una grafia de cabecera nueva aparece, los dos tienen que conocerla
# y en dos ficheros acabarian discrepando.
#
# Este fichero existe para que ampliar el mapeo NO sea tocar el script. Cuando el
# generador encuentra algo que no esta aqui NO lo descarta en silencio: lo vuelca en
# la hoja NO_RECONOCIDO del maestro y termina con codigo de salida != 0.
#
# Asi se detectaron 13 categorias (~107 filas) que aparecian solo en los workbooks
# EP9B / EP14A / EP14B / EP15 y que se habrian perdido sin avisar.

# --------------------------------------------------------------------------------
# Categoria de la columna "Cat." del BOQ (Recuento Conjuntos) -> entidad LOV.
# La clave se compara en MAYUSCULAS y con espacios colapsados.
# --------------------------------------------------------------------------------
boq_categories:
  # --- Foundation
  FOUNDATIONS: Foundation
  L FOUNDATIONS: Foundation
  FOUNDATION IN L: Foundation
  POLES SUPPORTS IN LATERAL WALL: Foundation
  SUPPORTS IN LATERAL WALLS: Foundation
  SUPPORTS IN WALLS: Foundation
  POLES SUPPORTS IN WALLS: Foundation          # EP15
  POLES SUPPORTS ON TOP WALL: Foundation
  SUPPORTS IN TOP WALLS: Foundation
  SUPPORTS ON TOP WALLS: Foundation            # EP14A, EP14B
  POLES SUPPORTS IN DRAINAGE: Foundation
  SUPPORTS IN DRENAIGE: Foundation             # sic, erratа en el origen
  BRIDGE SUPPORTS: Foundation
  VIADUCTO: Foundation
  VIADUCTO EXISTENTE: Foundation

  # --- AnchorageFoundation
  ANCHOR FOUND.: AnchorageFoundation
  L ANCHOR FOUND.: AnchorageFoundation
  ANC.SUP. L.WALL: AnchorageFoundation
  ANC.SUP. T.WALL: AnchorageFoundation
  TUNNEL ANCHOR: AnchorageFoundation
  ANCLAJES: AnchorageFoundation
  ANCLAJES EN TUNEL: AnchorageFoundation
  ANCLAJE TX TUNEL / MURO: AnchorageFoundation

  # --- PoleType
  POLES: PoleType
  POSTES: PoleType
  POSTES SIMPLES: PoleType                     # EP9B
  POSTES DOBLES: PoleType                      # EP9B
  POSTES ESPECIALES: PoleType                  # EP9B

  # --- Portal
  PORTALS: Portal
  PORTICOS: Portal
  "HEADSPAN\nSPRC": Portal
  HEADSPAN SPRC: Portal
  HEADSPAN LOD STATION AND DEPOT: Portal       # EP9B
  SEMIPÓRTICO: Portal                          # EP9B
  GANTRIES: Portal
  PÓRTICOS-F: Portal

  # --- SupportType
  CANTILEVER SUPPORTS: SupportType
  SILLETAS: SupportType

  # --- CantileverType
  CANTILEVERS: CantileverType

  # --- SteadyArmType
  STEADY ARMS: SteadyArmType
  BRAZOS MENS: SteadyArmType

  # --- ReturnSupport
  RW ASSEMBLIES: ReturnSupport

  # --- DisconnectorFunction
  DISCONNECTORS ASSEMBLIES: DisconnectorFunction
  APARELLAJES: DisconnectorFunction
  SECCIONADORES: DisconnectorFunction
  AUTOVALV.: DisconnectorFunction

  # --- Anchorage
  ANCHOR TIES: Anchorage
  TIRANTES: Anchorage
  BALANCE/TENSOREX EQUIPMENTS: Anchorage
  COMPENSACION: Anchorage
  TENSOREX: Anchorage

