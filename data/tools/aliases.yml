# --------------------------------------------------------------------------------
# Valores que pertenecen a la columna "Obs." pero que en algunos ficheros (EP9B)
# aparecen escritos en la columna "Cat.". Como "Cat." se arrastra hacia abajo, si
# los tomasemos por categoria contaminariamos todas las filas siguientes.
# Al detectar uno de estos, se CONSERVA la categoria anterior.
# --------------------------------------------------------------------------------
obs_leaked_into_category:
  - MANUAL
  - CHECK
  - COMPROBACION
  - FORMULA
  - FÓRMULA
  - AUXILIARES
  - RECUENTO ESPECIAL
  - INDICAR CADA COLA
  - SE PONE 1 POR CADA COLA
  - SE PONE 1 POR CADA 2 COLAS -- 2X
  - (LÁMINAS DE AIRE)
  - (LÁMINAS DE AIRE CON AC)
  - .-LAS CUENTAS DE PP SOLO SE HACEN EN V1
  - FOUNDATION WITH SCADA
  - FOUNDATION WITHOUT SCADA

# --------------------------------------------------------------------------------
# Hoja Legend: seccion -> entidad LOV.
#   __TYPE_Foundation / __TYPE_Portal  ->  catalogos de tipos, no LOVs finales
#   __SPLIT_POLE_SUPPORT               ->  HEB* va a PoleType, el resto a SupportType
#   null                               ->  seccion conocida pero fuera de alcance
# --------------------------------------------------------------------------------
legend_sections:
  SECTIONNING: Sectioning
  ANCHORAGE: Anchorage
  ANCHORAGE FOUNDATIONS: AnchorageFoundation
  CANTILEVERS: CantileverType
  FEEDING: DisconnectorFunction
  STEADY ARMS TYPE: SteadyArmType
  RETURN SUPPORT: ReturnSupport
  POLE FOUNDATION: __TYPE_Foundation
  PORTALS: __TYPE_Portal
  POLE / SUPPORTS TYPE: __SPLIT_POLE_SUPPORT
  COLORS: null                  # singularidades del trazado, no hay entidad LOV
  TEXT WORKBOOK: null           # se cubre con el enum ProfileStatusValue
  SEMI TENSION LENGTH: null     # es una medida, no un catalogo
  LEGEND: null                  # titulo de la hoja

# Filas del Legend que abren una subseccion aunque no vayan en MAYUSCULAS.
