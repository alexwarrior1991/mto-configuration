# Perfil de desarrollo. Las credenciales de este fichero son desechables y solo valen contra
# el stack local que levanta docker-compose. Ningun valor de un entorno desplegado debe
# escribirse aqui: la configuracion base (application.yaml) no lleva valores por defecto para
# los secretos justamente para que un despliegue sin gestor de secretos no arranque.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mto_configuration_db
    username: mto_configuration_user
    password: mto_configuration_password
    driver-class-name: org.postgresql.Driver

  flyway:
    url: jdbc:postgresql://localhost:5432/mto_configuration_db
    user: mto_configuration_user
    password: mto_configuration_password
    default-schema: mto_configuration
    schemas: mto_configuration

  jpa:
    properties:
      hibernate:
        default_schema: mto_configuration

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth.mto.local:8082/realms/mto
      client:
        # Cuenta de servicio para las llamadas salientes. Valor local; en docker-compose lo pisa
        # la variable de entorno, que tiene mas precedencia que este fichero.
        registration:
          mto-services:
            client-secret: mto-configuration-svc-secret

app:
  security:
    client-id: mto-configuration-api
    required-audience: mto-configuration-api
    # Entorno de desarrollo: la documentacion interactiva es la forma habitual de probar la API.
    expose-api-docs: true
    cors:
      allowed-origins:
        - http://localhost:4200