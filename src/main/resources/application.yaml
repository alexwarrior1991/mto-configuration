cache:
  application: mto-configuration
  redis:
    default-ttl: 30m
    normal-item-ttl: 6h
    normal-list-ttl: 30m
    normal-page-ttl: 10m
    normal-search-ttl: 10m
    lov-item-ttl: 24h
    lov-list-ttl: 24h
    allowed-subtypes:
      - com.alejandro.mtoconfiguration
      - java.util
      - java.time
      - org.springframework.data.domain