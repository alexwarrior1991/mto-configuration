# Spring Framework configuration
spring:
  # Application identification
  application:
    name: mto-configuration

  # Cache provider configuration - using Redis as the caching mechanism
  cache:
    type: redis
    redis:
      # Expone cache.gets{result=hit|miss} en Micrometer: sin esto el hit ratio
      # real de la cache es invisible.
      enable-statistics: true

  # Redis configuration for distributed caching
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Una cache que tarda 2s en responder ya no es una cache: se baja a 1s
      # para que un Redis atascado no arrastre la latencia de cada peticion.
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:1s}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s


#  SPRING_DATASOURCE_URL: permite cambiar la URL desde Docker.
#  localhost: se usa cuando ejecutas la app fuera de Docker.
#  postgres: se usará dentro de Docker Compose como nombre del servicio.
#  mto_configuration: nombre de la base de datos.
#  mto_user: usuario de PostgreSQL.
#  mto_password: contraseña de PostgreSQL.

  datasource:
    url: ${MTO_CONFIGURATION_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mto_configuration_db}
    username: ${MTO_CONFIGURATION_DATASOURCE_USERNAME:mto_configuration_user}
    password: ${MTO_CONFIGURATION_DATASOURCE_PASSWORD:mto_configuration_password}
    driver-class-name: org.postgresql.Driver

#  locations: Indica dónde estarán tus scripts SQL en src/main/resources/db/migration
#  V1__init_schema.sql
#  V2__insert_initial_lov_data.sql
#  V3__add_new_table.sql
#  default-schema: Indica el esquema por defecto que usará Flyway.
#  schemas: Le dice a Flyway qué schema debe gestionar.
#  create-schemas: Permite que Flyway cree el schema automáticamente si no existe.
#  baseline-on-migrate: Esto ayuda si la base de datos ya existía antes de usar Flyway
#  validate-on-migrate: Hace que Flyway valide las migraciones antes de ejecutarlas.
# Si alguien modifica un script ya aplicado, Flyway lo detectará y fallará para proteger la consistencia de la base de datos.
# clean-disabled: Evita que se pueda ejecutar accidentalmente un borrado completo de la base de datos con flyway clean
  flyway:
    enabled: true
    url: ${MTO_CONFIGURATION_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mto_configuration_db}
    user: ${MTO_CONFIGURATION_DATASOURCE_USERNAME:mto_configuration_user}
    password: ${MTO_CONFIGURATION_DATASOURCE_PASSWORD:mto_configuration_password}
    locations: classpath:db/migration
    default-schema: ${MTO_CONFIGURATION_DB_SCHEMA:mto_configuration}
    schemas: ${MTO_CONFIGURATION_DB_SCHEMA:mto_configuration}
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  # JPA/Hibernate configuration for database operations
  jpa:
    properties:
      hibernate:
        # Number of entities to fetch in a single batch - improves performance by reducing queries
        default_batch_fetch_size: 20
        default_schema: ${MTO_CONFIGURATION_DB_SCHEMA:mto_configuration}
        format_sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect


  # RabbitMQ connection and messaging configuration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: /
    # Publisher confirmation type for reliable message delivery
    publisher-confirm-type: correlated
    # Return undeliverable messages to the publisher
    publisher-returns: true
    listener:
      simple:
        # Auto-acknowledge messages upon successful processing
        acknowledge-mode: auto
        retry:
          # Enable automatic retry mechanism for failed messages
          enabled: true
          # Initial delay before first retry attempt
          initial-interval: 1000ms
          # Maximum delay between retry attempts
          max-interval: 10000ms
          # Exponential backoff multiplier
          multiplier: 2
          # Maximum number of retry attempts before sending to DLQ
          max-retries: 3

  # Virtual threads configuration for improved scalability (Java 21+)
  threads:
    virtual:
      enabled: true
      
  # OAuth2 resource server configuration for JWT-based authentication
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak issuer URI for JWT token validation
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://auth.mto.local:8082/realms/mto}


# Custom application-specific configuration
app:
  # RabbitMQ messaging configuration
  rabbitmq:
    # Enable/disable RabbitMQ functionality
    enabled: true

    # Default settings for exchanges, queues, and bindings
    defaults:
      # Queues/exchanges survive broker restarts
      durable: true
      # Queue is not restricted to a single connection
      exclusive: false
      # Queue/exchange is not deleted when unused
      auto-delete: false
      # Enable dead letter queues for failed messages
      dead-letter-enabled: true
      # Suffix for dead letter exchange names
      dead-letter-exchange-suffix: .dlx
      # Suffix for dead letter queue names
      dead-letter-queue-suffix: .dlq
      # Suffix for dead letter routing keys
      dead-letter-routing-key-suffix: .dlq

    # RabbitMQ message listener configuration
    listener:
      # Initial number of concurrent message consumers
      concurrent-consumers: 1
      # Maximum number of concurrent consumers for scalability
      max-concurrent-consumers: 5
      # Number of unacknowledged messages a consumer can have
      prefetch-count: 10
      # Do not requeue rejected messages (send to DLQ instead)
      default-requeue-rejected: false
      # Timeout for receiving messages in milliseconds
      receive-timeout: 1000

    # RabbitMQ message publisher configuration
    publisher:
      # Return messages if they cannot be routed to any queue
      mandatory: true

    # RabbitMQ exchange definitions - routing mechanisms for messages
    exchanges:
      # Topic exchange for master data events with pattern-based routing
      - name: mto.master-data.exchange
        type: topic
        durable: true
        auto-delete: false

    # RabbitMQ queue definitions - message storage endpoints
    queues:
      # Queue for general master data events
      - name: mto.master-data.events.queue
        durable: true
        dead-letter-enabled: true

      # Queue for cache invalidation events
      - name: mto.master-data.cache.queue
        durable: true
        dead-letter-enabled: true

      # Queue for audit trail events
      - name: mto.master-data.audit.queue
        durable: true
        dead-letter-enabled: true

      # Queue specifically for deleted entity events
      - name: mto.master-data.deleted.queue
        durable: true
        dead-letter-enabled: true

    # RabbitMQ bindings - connect queues to exchanges with routing keys
    bindings:
      # Bind events queue to receive all master data events
      - queue: mto.master-data.events.queue
        exchange: mto.master-data.exchange
        routing-key: mto.master-data.#

      # Bind cache queue to receive all master data events for cache invalidation
      - queue: mto.master-data.cache.queue
        exchange: mto.master-data.exchange
        routing-key: mto.master-data.#

      # Bind audit queue to receive all master data events for audit logging
      - queue: mto.master-data.audit.queue
        exchange: mto.master-data.exchange
        routing-key: mto.master-data.#

      # Bind deleted queue to receive only deletion events (pattern: *.deleted)
      - queue: mto.master-data.deleted.queue
        exchange: mto.master-data.exchange
        routing-key: mto.master-data.*.deleted

  # Application security configuration for authentication and authorization
  security:
    # Keycloak client identifier for this application
    client-id: ${KEYCLOAK_CLIENT_ID:mto-configuration-api}
    # JWT claim to use as the principal username
    principal-claim: preferred_username
    # Validate that JWT contains the required audience
    audience-validation-enabled: true
    # Expected audience value in JWT tokens. Si audience-validation-enabled esta activo y este
    # valor llega vacio, la aplicacion no arranca: sin audiencia la API aceptaria cualquier token
    # emitido por el realm, incluido el del frontal de otra aplicacion.
    required-audience: ${KEYCLOAK_AUDIENCE:mto-configuration-api}
    # Publicar /swagger-ui y /v3/api-docs sin autenticacion. Cerrado por defecto para que un
    # entorno desplegado nuevo no exponga el catalogo completo de endpoints por olvido: los
    # perfiles de desarrollo lo abren explicitamente.
    expose-api-docs: ${APP_SECURITY_EXPOSE_API_DOCS:false}
    # Cross-Origin Resource Sharing (CORS) configuration
    cors:
      # Allowed origins for cross-origin requests
      allowed-origins:
        - ${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
      # HTTP methods allowed for cross-origin requests
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      # Headers allowed in cross-origin requests
      allowed-headers:
        - Authorization
        - Content-Type
        - Accept
        - Origin
        - X-Requested-With
      # Headers exposed to the client in cross-origin responses
      exposed-headers:
        - Location
      # La API es stateless y se autentica con la cabecera Authorization: no hay cookies que
      # enviar, asi que habilitar credenciales solo ampliaria la superficie.
      allow-credentials: false
      # How long preflight request results can be cached (seconds)
      max-age: 3600
  
  # Transactional outbox pattern configuration for reliable message publishing
  outbox:
    # Enable/disable the outbox pattern
    enabled: true
    # Maximum retry attempts for failed message publishing
    max-attempts: 10
    # Initial delay before retrying failed messages
    initial-retry-delay: 5s
    # Fixed delay between outbox publisher executions
    publisher-fixed-delay: 5s

# Cache configuration for Redis-based caching strategy
cache:
  # Application name for cache key prefixing
  application: mto-configuration
  redis:
    # Ventana durante la que se cortocircuita Redis tras un fallo de conexion,
    # para no pagar el timeout en cada peticion. Pasada la ventana se reintenta.
    degraded-retry-window: 30s
    # Default time-to-live for cached entries
    default-ttl: 30m
    # TTL for individual entity items
    normal-item-ttl: 6h
    # TTL for lists of entities
    normal-list-ttl: 30m
    # TTL for paginated results
    normal-page-ttl: 10m
    # TTL for search query results
    normal-search-ttl: 10m
    # TTL for list of values (LOV) items - longer due to infrequent changes
    lov-item-ttl: 24h
    # TTL for list of values (LOV) lists
    lov-list-ttl: 24h
    # Allowed package prefixes for serialization security
    allowed-subtypes:
      - com.alejandro.mtoconfiguration
      - java.util
      - java.time
      - org.springframework.data.domain
# Respuestas de error de la API (RFC 9457 Problem Details)
configuration:
  modules:
    rest:
      exception-handler:
        enabled: true
      errors:
        # Prefijo del campo "type" de cada problema. Debe ser estable: los clientes
        # pueden discriminar por él, así que cambiarlo rompe integraciones.
        type-base-uri: ${MTO_CONFIGURATION_ERROR_TYPE_BASE_URI:https://api.mto-configuration/errors}
        # Añade la excepción a la respuesta de los 5xx. Solo para depurar en entornos
        # no productivos: revela estructura interna a quien llame.
        include-stack-trace: ${MTO_CONFIGURATION_ERROR_INCLUDE_STACKTRACE:false}
