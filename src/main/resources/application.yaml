spring:
  application:
    name: mto-configuration

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s

  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 20

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000ms
          max-retries: 3
          max-interval: 10000ms
          multiplier: 2


app:
  rabbitmq:
    enabled: true

    defaults:
      durable: true
      exclusive: false
      auto-delete: false
      dead-letter-enabled: true
      dead-letter-exchange-suffix: .dlx
      dead-letter-queue-suffix: .dlq
      dead-letter-routing-key-suffix: .dlq

    listener:
      concurrent-consumers: 1
      max-concurrent-consumers: 5
      prefetch-count: 10
      default-requeue-rejected: false
      receive-timeout: 1000

    publisher:
      mandatory: true

