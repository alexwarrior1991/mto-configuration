# Spring Framework configuration
spring:
  # Application identification
  application:
    name: mto-configuration

  # Cache provider configuration - using Redis as the caching mechanism
  cache:
    type: redis
    redis:
      # Expone cache.gets{result=hit|miss} en Micrometer: sin esto el hit ratio
      # real de la cache es invisible.
      enable-statistics: true

  # Redis configuration for distributed caching
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Una cache que tarda 2s en responder ya no es una cache: se baja a 1s
      # para que un Redis atascado no arrastre la latencia de cada peticion.
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:1s}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s


#  SPRING_DATASOURCE_URL: permite cambiar la URL desde Docker.
#  localhost: se usa cuando ejecutas la app fuera de Docker.
#  postgres: se usará dentro de Docker Compose como nombre del servicio.
#  mto_configuration: nombre de la base de datos.
#  mto_user: usuario de PostgreSQL.
#  mto_password: contraseña de PostgreSQL.

  datasource:
    url: ${MTO_CONFIGURATION_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mto_configuration_db}
    username: ${MTO_CONFIGURATION_DATASOURCE_USERNAME:mto_configuration_user}
    password: ${MTO_CONFIGURATION_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

#  locations: Indica dónde estarán tus scripts SQL en src/main/resources/db/migration
#  V1__init_schema.sql
#  V2__insert_initial_lov_data.sql
#  V3__add_new_table.sql
#  default-schema: Indica el esquema por defecto que usará Flyway.
#  schemas: Le dice a Flyway qué schema debe gestionar.
#  create-schemas: Permite que Flyway cree el schema automáticamente si no existe.
#  baseline-on-migrate: Esto ayuda si la base de datos ya existía antes de usar Flyway
#  validate-on-migrate: Hace que Flyway valide las migraciones antes de ejecutarlas.
# Si alguien modifica un script ya aplicado, Flyway lo detectará y fallará para proteger la consistencia de la base de datos.
# clean-disabled: Evita que se pueda ejecutar accidentalmente un borrado completo de la base de datos con flyway clean
  flyway:
    enabled: true
    url: ${MTO_CONFIGURATION_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mto_configuration_db}
    user: ${MTO_CONFIGURATION_DATASOURCE_USERNAME:mto_configuration_user}
    password: ${MTO_CONFIGURATION_DATASOURCE_PASSWORD}
    locations: classpath:db/migration
    default-schema: ${MTO_CONFIGURATION_DB_SCHEMA:mto_configuration}
    schemas: ${MTO_CONFIGURATION_DB_SCHEMA:mto_configuration}
    create-schemas: true
    # Necesario para adoptar Flyway sobre una base que YA tiene el esquema (creado
    # en su dia por Hibernate). Sin esto, Flyway se encuentra un schema poblado sin
    # tabla de historico y aborta el arranque. Con baseline-version 1, da V1 por
    # aplicada sin ejecutarla y sigue por V2. En una base vacia no interviene: se
    # aplican todas las migraciones desde V1.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: esquema preexistente
    validate-on-migrate: true
    clean-disabled: true

  # JPA/Hibernate configuration for database operations
  jpa:
    properties:
      hibernate:
        # Number of entities to fetch in a single batch - improves performance by reducing queries
        default_batch_fetch_size: 20
        default_schema: ${MTO_CONFIGURATION_DB_SCHEMA:mto_configuration}
        format_sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect


  # RabbitMQ connection and messaging configuration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: /
    # Publisher confirmation type for reliable message delivery
    publisher-confirm-type: correlated
    # Return undeliverable messages to the publisher
    publisher-returns: true
    listener:
      simple:
        # Auto-acknowledge messages upon successful processing
        acknowledge-mode: auto
        # Consumidores iniciales y maximos, y mensajes sin confirmar por consumidor.
        # Viven aqui y no en app.rabbitmq porque es Boot quien los aplica: tenerlos
        # duplicados en dos sitios fue lo que hizo creer que el bloque de reintentos
        # de abajo estaba activo cuando no lo leia nadie.
        concurrency: 1
        max-concurrency: 5
        prefetch: 10
        # No se reencola un mensaje rechazado: se manda a su DLQ
        default-requeue-rejected: false
        receive-timeout: 1s
        retry:
          # Enable automatic retry mechanism for failed messages
          enabled: true
          # Initial delay before first retry attempt
          initial-interval: 1000ms
          # Maximum delay between retry attempts
          max-interval: 10000ms
          # Exponential backoff multiplier
          multiplier: 2
          # Maximum number of retry attempts before sending to DLQ
          max-retries: 3

  # Virtual threads configuration for improved scalability (Java 21+)
  threads:
    virtual:
      enabled: true
      
  # OAuth2 resource server configuration for JWT-based authentication
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak issuer URI for JWT token validation
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://auth.mto.local:8082/realms/mto}

      # Cliente para las llamadas SALIENTES a otros servicios del dominio, que se autentican
      # contra este mismo Keycloak.
      client:
        provider:
          keycloak:
            # Se declara el endpoint de token en lugar de issuer-uri a proposito: el
            # descubrimiento por issuer es una llamada HTTP durante la creacion del bean, y con
            # ella la aplicacion volveria a no arrancar si Keycloak no esta listo todavia.
            token-uri: ${KEYCLOAK_TOKEN_URI:http://auth.mto.local:8082/realms/mto/protocol/openid-connect/token}
        registration:
          # Cuenta de servicio de esta aplicacion. client_credentials y no password: el token
          # representa al servicio, no a una persona, y asi la auditoria del servicio remoto no
          # atribuye a un usuario lo que hizo un proceso.
          mto-services:
            provider: keycloak
            client-id: ${KEYCLOAK_SERVICE_CLIENT_ID:mto-configuration-svc}
            # Sin valor por defecto a proposito: si la variable falta, la aplicacion no arranca.
            # Es preferible a que arranque con un secreto de ejemplo y nadie se entere.
            client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic


# Custom application-specific configuration
app:
  # RabbitMQ messaging configuration
  rabbitmq:
    # Enable/disable RabbitMQ functionality
    enabled: true

    # Default settings for exchanges, queues, and bindings
    defaults:
      # Si este servicio declara las colas de la lista.
      #
      # Una cola pertenece a quien la CONSUME, no a quien publica: es el consumidor
      # el que sabe que TTL, que limite y que tipo necesita.
      #
      # Declararla en los dos lados es idempotente SOLO si los argumentos coinciden
      # exactamente. Si no, el broker responde PRECONDITION_FAILED y cierra el canal:
      # los exchanges ya declarados sobreviven, pero se quedan sin declarar el resto
      # de colas del lote y TODOS los bindings, y sin bindings no se enruta nada.
      #
      # Sigue en true porque las colas de abajo ya existen en los entornos y las
      # consumen otros servicios: pasarlo a false hay que coordinarlo con ellos.
      # Ver README_MESSAGING.md, "Traspaso de las colas a sus consumidores".
      declare-queues: true
      # Tipo por defecto. Cambiar el tipo de una cola que ya existe obliga a
      # borrarla y recrearla, asi que esto solo aplica a colas nuevas.
      queue-type: classic
      # Queues/exchanges survive broker restarts
      durable: true
      # Queue is not restricted to a single connection
      exclusive: false
      # Queue/exchange is not deleted when unused
      auto-delete: false
      # Enable dead letter queues for failed messages
      dead-letter-enabled: true
      # Suffix for dead letter exchange names
      dead-letter-exchange-suffix: .dlx
      # Suffix for dead letter queue names
      dead-letter-queue-suffix: .dlq
      # Suffix for dead letter routing keys
      dead-letter-routing-key-suffix: .dlq

    # RabbitMQ message publisher configuration
    publisher:
      # Return messages if they cannot be routed to any queue
      mandatory: true

    # RabbitMQ exchange definitions - routing mechanisms for messages
    exchanges:
      # Topic exchange for master data events with pattern-based routing
      - name: mto.master-data.exchange
        type: topic
        durable: true
        auto-delete: false

    # RabbitMQ queue definitions - message storage endpoints
    #
    # OJO al tocar estas colas: los argumentos de una cola que ya existe son
    # INMUTABLES. Anadir aqui un max-length o un overflow a una cola ya creada hace
    # que el broker responda PRECONDITION_FAILED y se caiga la declaracion entera.
    # Para ponerle limites a una cola existente se usa una policy del broker; para
    # cambiarle el tipo, hay que borrarla y recrearla. Ambos procedimientos estan en
    # README_MESSAGING.md.
    queues:
      # Queue for general master data events
      - name: mto.master-data.events.queue
        durable: true
        dead-letter-enabled: true

      # Queue for cache invalidation events
      - name: mto.master-data.cache.queue
        durable: true
        dead-letter-enabled: true

      # Queue for audit trail events
      - name: mto.master-data.audit.queue
        durable: true
        dead-letter-enabled: true

      # Queue specifically for deleted entity events
      - name: mto.master-data.deleted.queue
        durable: true
        dead-letter-enabled: true

    # RabbitMQ bindings - connect queues to exchanges with routing keys
    bindings:
      # Bind events queue to receive all master data events
      - queue: mto.master-data.events.queue
        exchange: mto.master-data.exchange
        routing-key: mto.master-data.#

      # Bind cache queue to receive all master data events for cache invalidation
      - queue: mto.master-data.cache.queue
        exchange: mto.master-data.exchange
        routing-key: mto.master-data.#

      # Bind audit queue to receive all master data events for audit logging
      - queue: mto.master-data.audit.queue
        exchange: mto.master-data.exchange
        routing-key: mto.master-data.#

      # Bind deleted queue to receive only deletion events (pattern: *.deleted)
      - queue: mto.master-data.deleted.queue
        exchange: mto.master-data.exchange
        routing-key: mto.master-data.*.deleted

  # Application security configuration for authentication and authorization
  security:
    # Keycloak client identifier for this application
    client-id: ${KEYCLOAK_CLIENT_ID:mto-configuration-api}
    # JWT claim to use as the principal username
    principal-claim: preferred_username
    # Validate that JWT contains the required audience
    audience-validation-enabled: true
    # Expected audience value in JWT tokens. Si audience-validation-enabled esta activo y este
    # valor llega vacio, la aplicacion no arranca: sin audiencia la API aceptaria cualquier token
    # emitido por el realm, incluido el del frontal de otra aplicacion.
    required-audience: ${KEYCLOAK_AUDIENCE:mto-configuration-api}
    # Publicar /swagger-ui y /v3/api-docs sin autenticacion. Cerrado por defecto para que un
    # entorno desplegado nuevo no exponga el catalogo completo de endpoints por olvido: los
    # perfiles de desarrollo lo abren explicitamente.
    expose-api-docs: ${APP_SECURITY_EXPOSE_API_DOCS:false}
    # Cross-Origin Resource Sharing (CORS) configuration
    cors:
      # Allowed origins for cross-origin requests
      allowed-origins:
        - ${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
      # HTTP methods allowed for cross-origin requests
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      # Headers allowed in cross-origin requests
      allowed-headers:
        - Authorization
        - Content-Type
        - Accept
        - Origin
        - X-Requested-With
      # Headers exposed to the client in cross-origin responses
      exposed-headers:
        - Location
      # La API es stateless y se autentica con la cabecera Authorization: no hay cookies que
      # enviar, asi que habilitar credenciales solo ampliaria la superficie.
      allow-credentials: false
      # How long preflight request results can be cached (seconds)
      max-age: 3600
  
  # Trabajos en segundo plano (202 Accepted + jobId + consulta de estado).
  #
  # Los topes NO son una precaucion teorica. Un trabajo de fondo corre en un hilo
  # virtual, que es barato, pero retiene una conexion de HikariCP mientras dura, y
  # eso no lo es: sin tope, media docena de exportaciones de vias grandes vacian el
  # pool y dejan sin conexiones a las peticiones normales. El recurso escaso no es
  # el hilo, es la conexion.
  jobs:
    profile:
      # Exportaciones simultaneas. Cada una mantiene abierta una transaccion de
      # solo lectura mientras recorre la via entera por ventanas.
      export-max-concurrency: ${APP_JOBS_PROFILE_EXPORT_MAX_CONCURRENCY:2}
      # Cargas masivas simultaneas. Una: escriben, y varias a la vez multiplican la
      # contencion sobre las mismas filas sin acabar antes.
      bulk-max-concurrency: ${APP_JOBS_PROFILE_BULK_MAX_CONCURRENCY:1}
      # Directorio de los CSV generados. Con varias replicas debe apuntar a
      # almacenamiento COMPARTIDO, o la descarga fallara con 410 cuando la sirva una
      # replica distinta de la que genero el fichero.
      export-directory: ${APP_JOBS_PROFILE_EXPORT_DIRECTORY:exports}
      # Cada cuantos elementos baja el progreso a la base de datos. Escribir en cada
      # elemento seria duplicar las escrituras de la carga entera para mover un
      # contador que nadie mira con esa resolucion.
      progress-flush-interval: 25
      # Errores por elemento que se guardan. Una carga de cien mil elementos con un
      # mapeo mal hecho produce cien mil errores identicos: guardarlos todos convierte
      # la fila del trabajo en varios megas y la respuesta del estado en una descarga.
      # El recuento completo sigue en failedItems.
      max-item-errors: 50
      max-item-error-message-length: 500

  # Firma de los mensajes asincronos
  messaging:
    signature:
      # Secreto compartido con los consumidores. CON secreto la firma es HMAC-SHA256
      # y protege de manipulacion: quien altere el mensaje no puede recalcularla.
      # SIN secreto se degrada a SHA-256 simple, que detecta corrupcion pero no
      # manipulacion, porque cualquiera que cambie el contenido puede recalcularlo.
      # Vacio por defecto: repartir un secreto entre servicios es una decision de
      # explotacion, y exigirlo impediria arrancar a quien no lo necesite.
      secret: ${MTO_MESSAGING_SIGNATURE_SECRET:}

  # Transactional outbox pattern configuration for reliable message publishing
  outbox:
    # Enable/disable the outbox pattern
    enabled: true
    # Intentos antes de dar el mensaje por perdido (FAILED). Con backoff exponencial
    # acotado, 20 intentos cubren mas de una hora de broker caido.
    max-attempts: 20
    # Retardo del primer reintento; se duplica en cada intento hasta max-retry-delay
    initial-retry-delay: 5s
    # Tope del backoff exponencial
    max-retry-delay: 5m
    # Desviacion aleatoria del retardo (0.2 => [0.8*d, 1.2*d]): evita que todas las
    # replicas reintenten a la vez contra un broker que acaba de levantarse
    retry-jitter: 0.2
    # Fixed delay between outbox publisher executions
    publisher-fixed-delay: 5s
    # Mensajes que reclama cada pasada del relay
    batch-size: 50
    # Tiempo que un mensaje reclamado queda invisible para el resto de replicas.
    # Es la red de seguridad si el proceso muere entre reclamar y publicar.
    claim-visibility-timeout: 5m
    # Espera maxima por el publisher confirm antes de dar el envio por fallido
    confirm-timeout: 10s
    # Cada cuanto se refresca la foto del outbox que publican las metricas. Los
    # gauges NO consultan la base de datos en cada scrape de Prometheus.
    metrics-refresh-delay: 30s
    # Publica los mensajes de un mismo agregado en el orden en que se generaron. Sin
    # esto, un mensaje que falla y se reprograma deja pasar por delante al siguiente
    # del mismo agregado, y el consumidor aplica el cambio viejo encima del nuevo.
    # El coste es que un mensaje atascado frena a los de SU agregado, solo a esos.
    strict-ordering-per-aggregate: true
    # Publica en cuanto la transaccion de negocio confirma, sin esperar al sondeo.
    # El sondeo sigue como red de seguridad: esto solo le quita el suelo de latencia,
    # que era de hasta publisher-fixed-delay para TODOS los eventos.
    immediate-dispatch: true
    # Borrado de los mensajes ya publicados. Sin esto outbox_message solo crece:
    # cada cambio de dato maestro deja una fila con su JSON, y las operaciones
    # masivas publican un evento por entidad.
    purge:
      enabled: true
      # Margen para investigar un incidente de mensajeria con la tabla delante
      retention: 7d
      # Se borra por lotes: un DELETE de millones de filas hincha el WAL y bloquea
      # el vacuum de la tabla
      batch-size: 500
      # Tope de trabajo por pasada, para que la primera ejecucion sobre una tabla
      # enorme no se convierta en un borrado de horas
      max-batches-per-run: 20
      fixed-delay: 1h

# Endpoints de explotacion. Por defecto Boot solo expone health, asi que el endpoint
# del outbox (estado y redrive de los FAILED) hay que declararlo. El acceso queda
# restringido a ADMIN/OPS en SecurityConfiguration.
management:
  endpoints:
    web:
      exposure:
        include: health,info,outbox,prometheus

  endpoint:
    health:
      # El health anonimo lo consultan el balanceador y las sondas del orquestador, asi que
      # tiene que seguir abierto, pero un UP/DOWN es todo lo que necesitan. El desglose por
      # componente enumera la base de datos, Redis y RabbitMQ con sus mensajes de error, y eso
      # solo lo ve quien trae el rol de explotacion.
      show-details: when-authorized
      show-components: when-authorized
      roles: OPS_METRICS

  # Trazabilidad distribuida (micrometer-tracing-bridge-otel + exportador OTLP).
  tracing:
    enabled: ${MTO_TRACING_ENABLED:true}
    sampling:
      # Muestrear el 100% en un servicio con trafico real es caro y casi nunca hace
      # falta. Ojo: un span NO muestreado sigue propagando su traceparent (con el
      # flag a 00), asi que la cadena entre servicios no se rompe por muestrear poco.
      probability: ${MTO_TRACING_SAMPLING_PROBABILITY:0.1}

  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        # Las metricas salen por Prometheus (ver /actuator/prometheus). El starter de
        # OpenTelemetry arrastra tambien un registro OTLP de metricas, y sin esto
        # intentaria empujarlas a un colector ademas de exponerlas.
        enabled: false

# Cache configuration for Redis-based caching strategy
cache:
  # Application name for cache key prefixing
  application: mto-configuration
  redis:
    # Ventana durante la que se cortocircuita Redis tras un fallo de conexion,
    # para no pagar el timeout en cada peticion. Pasada la ventana se reintenta.
    degraded-retry-window: 30s
    # Default time-to-live for cached entries
    default-ttl: 30m
    # TTL for individual entity items
    normal-item-ttl: 6h
    # TTL for lists of entities
    normal-list-ttl: 30m
    # TTL for paginated results
    normal-page-ttl: 10m
    # TTL for search query results
    normal-search-ttl: 10m
    # TTL for list of values (LOV) items - longer due to infrequent changes
    lov-item-ttl: 24h
    # TTL for list of values (LOV) lists
    lov-list-ttl: 24h
    # Allowed package prefixes for serialization security
    allowed-subtypes:
      - com.alejandro.mtoconfiguration
      - java.util
      - java.time
      - org.springframework.data.domain
# Respuestas de error de la API (RFC 9457 Problem Details)
configuration:
  modules:
    rest:
      exception-handler:
        enabled: true
      errors:
        # Prefijo del campo "type" de cada problema. Debe ser estable: los clientes
        # pueden discriminar por él, así que cambiarlo rompe integraciones.
        type-base-uri: ${MTO_CONFIGURATION_ERROR_TYPE_BASE_URI:https://api.mto-configuration/errors}
        # Añade la excepción a la respuesta de los 5xx. Solo para depurar en entornos
        # no productivos: revela estructura interna a quien llame.
        include-stack-trace: ${MTO_CONFIGURATION_ERROR_INCLUDE_STACKTRACE:false}
