spring:
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: mto_configuration
        format_sql: true
      jakarta:
        persistence:
          schema-generation:
            scripts:
              action: drop-and-create
              create-target: target/generated-schema/db_create.sql
              drop-target: target/generated-schema/db_drop.sql
            create-source: metadata
            drop-source: metadata