# Solo la aplicacion. PostgreSQL, Redis, RabbitMQ, Keycloak y el colector de trazas viven en
# mto-platform, que es el unico entorno local compartido del dominio.
#
# Este fichero traia antes el stack entero, y eso era justo lo que rompia el canal de mensajeria en
# silencio: esta aplicacion publicaba los eventos de datos maestros en su propio broker y mto-stock
# escuchaba en el suyo, asi que no llegaba nada y no fallaba nada. Con un solo broker ya no puede
# pasar.
#
# Lo habitual es no usar este fichero: 'docker compose --profile configuration up -d' en
# mto-platform levanta la imagen publicada. Este sirve para probar una construccion local contra
# esa misma infraestructura.
#
#   cd ../mto-platform && docker compose up -d   # solo infraestructura
#   docker compose up -d --build                 # esta aplicacion contra ella
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mto-configuration:${APP_IMAGE_TAG:-latest}
    container_name: mto-configuration-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}

      # La infraestructura la publica mto-platform en el host; desde dentro de este contenedor se
      # alcanza por host.docker.internal, y desde el IDE por localhost.
      MTO_CONFIGURATION_DATASOURCE_URL: ${MTO_CONFIGURATION_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/mto_configuration_db}
      MTO_CONFIGURATION_DATASOURCE_USERNAME: ${MTO_CONFIGURATION_DATASOURCE_USERNAME:-mto_configuration_user}
      MTO_CONFIGURATION_DATASOURCE_PASSWORD: ${MTO_CONFIGURATION_DATASOURCE_PASSWORD:?falta en .env, copiese .env.example}
      MTO_CONFIGURATION_DB_SCHEMA: ${MTO_CONFIGURATION_DB_SCHEMA:-mto_configuration}

      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-host.docker.internal}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}

      # EL MISMO broker del que consume mto-stock, el de mto-platform.
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-host.docker.internal}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-mto}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:?falta en .env, copiese .env.example}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${SPRING_RABBITMQ_VIRTUAL_HOST:-/}

      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel.mto.local:4318/v1/traces}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://auth.mto.local:8082/realms/mto}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-mto-configuration-api}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-mto-configuration-api}
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:?falta en .env, copiese .env.example}

      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost:4200}
      JAVA_OPTS: ${JAVA_OPTS:-}
    # El 'iss' del token es http://auth.mto.local:8082 y la aplicacion tiene que poder resolver ese
    # mismo nombre para descargar el JWK Set: es el mismo string el que viaja en el token y el que
    # se valida, asi que no vale apuntar a un nombre de contenedor desde dentro de la red.
    #
    # host.docker.internal no existe en Linux salvo que se declare; en Docker Desktop ya viene.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth.mto.local:host-gateway"
      - "otel.mto.local:host-gateway"
    ports:
      - "${APP_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
