name: mto-configuration-stack

services:
  # Servicio de base de datos PostgreSQL para almacenar los datos de la aplicación
  postgres:
    # Imagen de PostgreSQL versión 17 basada en Alpine Linux (ligera)
    image: postgres:17-alpine
    container_name: mto-configuration-postgres
    # Variables de entorno para configurar la base de datos PostgreSQL
    environment:
      POSTGRES_DB: mto_configuration_db
      POSTGRES_USER: mto_configuration_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta en .env, copiese .env.example}
    # Mapeo de puertos: puerto del host:puerto del contenedor
    ports:
      - "5432:5432"
    # Volumen para persistir los datos de PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Verificación de salud para comprobar que PostgreSQL está listo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mto_configuration_user -d mto_configuration_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Servicio de caché Redis para mejorar el rendimiento de la aplicación
  redis:
    # Imagen de Redis versión 7.4 basada en Alpine Linux (ligera)
    image: redis:7.4-alpine
    container_name: mto-configuration-redis
    # Mapeo de puertos: puerto del host:puerto del contenedor
    ports:
      - "6379:6379"
    # Volumen para persistir los datos de Redis
    volumes:
      - redis_data:/data
    # Comando para iniciar Redis con persistencia AOF (Append Only File)
    command: redis-server --appendonly yes
    # Verificación de salud para comprobar que Redis está listo
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Servicio de mensajería RabbitMQ para comunicación asíncrona entre servicios
  rabbitmq:
    # Imagen de RabbitMQ versión 4 con consola de administración, basada en Alpine Linux
    image: rabbitmq:4-management-alpine
    container_name: mto-configuration-rabbitmq
    # Variables de entorno para configurar RabbitMQ
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    # Mapeo de puertos: 5672 para AMQP, 15672 para la interfaz de administración web
    ports:
      - "5672:5672"
      - "15672:15672"
    # Volumen para persistir los datos de RabbitMQ
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    # Verificación de salud para comprobar que RabbitMQ está listo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Servicio de Keycloak para autenticación y autorización OAuth2/OpenID Connect
  keycloak:
    # Imagen oficial de Keycloak versión 26.1
    image: quay.io/keycloak/keycloak:26.1
    container_name: mto-configuration-keycloak
    # Keycloak 26 usa hostname v2: --hostname-port desaparecio y el puerto va dentro de la URL
    # de --hostname. Con la opcion antigua el contenedor moria nada mas arrancar con
    # "Unknown option: '--hostname-port'".
    #
    # Tampoco se pasa --hostname-strict=false: con una URL completa en --hostname, el modo
    # estricto (el de por defecto) es justo lo que se quiere, porque fija el 'iss' de los tokens
    # a http://auth.mto.local:8082 sea cual sea la cabecera Host de la peticion. Un emisor que
    # variase segun quien llama no coincidiria con KEYCLOAK_ISSUER_URI y la validacion fallaria.
    #
    # --import-realm carga /opt/keycloak/data/import al arrancar, de modo que el realm queda listo
    # sin tocar la consola. Si el realm ya existe, no lo pisa.
    command: start-dev --hostname=http://auth.mto.local:8082 --import-realm
    # Se monta mto-realm-local.json y no mto-realm.json: el primero es la variante local, que trae
    # usuarios de desarrollo y el secreto fijo de la cuenta de servicio. El segundo es la definicion
    # de referencia para entornos desplegados y no debe traer ni una cosa ni la otra.
    volumes:
      - ./keycloak/mto-realm-local.json:/opt/keycloak/data/import/mto-realm-local.json:ro
    # Variables de entorno para configurar las credenciales de administrador de Keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?falta en .env, copiese .env.example}
      KC_HTTP_ENABLED: true
      # Habilita /health/ready en el puerto de management (9000), que es lo unico que dice de
      # verdad si Keycloak ya sirve el realm.
      KC_HEALTH_ENABLED: true
    # Mapeo de puertos: 8082 para la API/consola, 9000 para health y metricas
    ports:
      - "8082:8080"
      - "9000:9000"
    # Un socket abierto en el 8080 no significa que el realm este disponible: Keycloak acepta
    # conexiones bastante antes de servir el JWK Set, y la app arrancaba contra un Keycloak que
    # todavia no respondia. Se sondea /health/ready en el puerto de management.
    healthcheck:
      # Escalar de bloque, no cadena entre comillas: el comando lleva comillas dobles y simples, y
      # entrecomillarlo en linea obliga a escaparlas hasta hacerlo ilegible. Los \r\n llegan
      # literales a printf, que es quien los convierte en el CRLF que exige HTTP.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      # Keycloak tarda en la primera arrancada (migracion de esquema); sin esto los primeros
      # sondeos cuentan como fallo.
      start_period: 30s

  # Servicio principal de la aplicación Spring Boot
  app:
    # Configuración de construcción del contenedor Docker
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mto-configuration-api
    # Variables de entorno para configurar la aplicación Spring Boot
    environment:
      SPRING_PROFILES_ACTIVE: docker

      MTO_CONFIGURATION_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mto_configuration_db
      MTO_CONFIGURATION_DATASOURCE_USERNAME: mto_configuration_user
      MTO_CONFIGURATION_DATASOURCE_PASSWORD: ${MTO_CONFIGURATION_DATASOURCE_PASSWORD:?falta en .env, copiese .env.example}
      MTO_CONFIGURATION_DB_SCHEMA: mto_configuration

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:?falta en .env, copiese .env.example}

      KEYCLOAK_ISSUER_URI: http://auth.mto.local:8082/realms/mto
      KEYCLOAK_CLIENT_ID: mto-configuration-api
      KEYCLOAK_AUDIENCE: mto-configuration-api
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:?falta en .env, copiese .env.example}

      APP_CORS_ALLOWED_ORIGIN: http://localhost:4200
    extra_hosts:
      - "auth.mto.local:host-gateway"
    # Mapeo de puertos: puerto del host:puerto del contenedor
    ports:
      - "8081:8080"
    # Dependencias de servicios: la aplicación espera a que los servicios estén listos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy

# Definición de volúmenes nombrados para persistir datos de los servicios
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: